# Deploy the live theme when changes land on production (e.g. merged PRs).
# Docs: https://shopify.dev/docs/storefronts/themes/tools/cli/ci-cd
#
# Required repo secrets:
#   SHOPIFY_CLI_THEME_TOKEN  – Theme Access password
#   SHOPIFY_FLAG_STORE       – e.g. arader-galleries-2.myshopify.com
#   SHOPIFY_THEME_ID         – numeric ID of the production theme

name: Deploy theme

on:
  push:
    branches: [production]

concurrency:
  group: deploy-live-theme
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
          SHOPIFY_FLAG_FORCE: "1"
        run: |
          shopify theme push \
            --json \
            --theme "${{ secrets.SHOPIFY_THEME_ID }}" \
            --allow-live \
            --ignore "config/settings_data.json"
